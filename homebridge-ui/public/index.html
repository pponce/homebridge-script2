<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Script2 Config</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --border: #dfe3eb;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #e91e63;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; background: var(--bg); color: var(--text); }
    .wrap { max-width: 980px; margin: 20px auto; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
    h2 { margin: 0 0 6px; font-size: 34px; font-weight: 500; }
    .subtitle { color: var(--muted); margin-bottom: 16px; }
    details.section { border: 1px solid var(--border); border-radius: 10px; margin: 14px 0; background: #fff; }
    details.section > summary { list-style: none; cursor: pointer; padding: 14px 16px; font-weight: 700; font-size: 22px; }
    details.section > summary::-webkit-details-marker { display:none; }
    .section-content { padding: 0 16px 14px; }
    .section-desc { color: var(--muted); margin: 0 0 10px; }
    details.device { border: 1px solid var(--border); border-radius: 8px; margin: 10px 0; }
    details.device > summary { list-style: none; cursor: pointer; padding: 10px 12px; font-weight: 600; display:flex; justify-content:space-between; }
    details.device > summary::-webkit-details-marker { display:none; }
    .device-body { padding: 0 12px 12px; }
    label { display:block; margin: 10px 0 4px; font-size: 12px; color:var(--muted); }
    input, select { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 7px; box-sizing: border-box; }
    .btn { border: none; border-radius: 8px; padding: 10px 14px; cursor: pointer; font-weight: 600; }
    .btn-add, #saveBtn { background: var(--accent); color: #fff; }
    .btn-remove { background: #f3f4f6; color: #111827; margin-top: 12px; }
    .actions { margin-top: 20px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h2>homebridge-script2</h2>
    <div class="subtitle">Configure Script2 in Homebridge UI without editing JSON manually.</div>
    <div id="app"></div>
    <div class="actions">
      <button id="saveBtn" class="btn">Save</button>
    </div>
  </div>
  <script src="index.js"></script>
</body>
</html>
