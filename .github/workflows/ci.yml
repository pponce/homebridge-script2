name: Script2 checks
on:
  push:
    branches: [master, certification-v1-beta]
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
        homebridge: ['^1.8.0', '^2.0.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ matrix.node }}'
          cache: npm
      - name: SSH publisher terminal regression
        run: |
          python3 scripts/check-publisher.py beta
          python3 scripts/check-publisher.py stable
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - name: Installed watcher
        run: node --test --test-name-pattern="installed chokidar" test/installed.cjs
      - name: Installed UI IPC
        run: node --test --test-name-pattern="packaged custom UI" test/installed.cjs
      - run: npm run check:package
      - name: Install exact package with supported Homebridge
        env:
          SCRIPT2_HB_VERSION: '${{ matrix.homebridge }}'
        run: |
          npm pack --ignore-scripts --json > "$RUNNER_TEMP/packed.json"
          script2_archive="$(node -p 'require(process.env.RUNNER_TEMP + "/packed.json")[0].filename')"
          npm install --prefix "$RUNNER_TEMP/script2-install" --ignore-scripts "$PWD/$script2_archive" "homebridge@$SCRIPT2_HB_VERSION"
          SCRIPT2_PACKAGE_ROOT="$RUNNER_TEMP/script2-install/node_modules/homebridge-script2" node --test test/installed.cjs
          SCRIPT2_HB_ROOT="$RUNNER_TEMP/script2-install/node_modules/homebridge" SCRIPT2_PACKAGE_ROOT="$RUNNER_TEMP/script2-install/node_modules/homebridge-script2" node scripts/homebridge-smoke.cjs
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --prefix "$RUNNER_TEMP/script2-browser" playwright@1.56.1
      - run: node "$RUNNER_TEMP/script2-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - run: SCRIPT2_BROWSER_MODULES="$RUNNER_TEMP/script2-browser/node_modules" npm run test:ui
  release:
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/master' && startsWith(github.event.head_commit.message, 'release: ')
    needs: [package, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: script2-github-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Publish checked GitHub release
        env:
          GH_TOKEN: '${{ github.token }}'
          RELEASE_COMMIT: '${{ github.sha }}'
          RELEASE_MESSAGE: '${{ github.event.head_commit.message }}'
        run: |
          version="$(node -p 'require("./package.json").version')"
          tag="v$version"
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const p = require('./package.json');
          const lock = require('./package-lock.json');
          assert.match(p.version, /^\d+\.\d+\.\d+$/);
          assert.ok(process.env.RELEASE_MESSAGE.startsWith(`release: ${p.version} - `));
          assert.equal(lock.version, p.version);
          assert.equal(lock.packages[''].version, p.version);
          assert.equal(lock.packages[''].engines.node, p.engines.node);
          assert.ok(fs.readFileSync(`releases/v${p.version}.md`, 'utf8').startsWith(`# Script2 ${p.version}\n`));
          NODE
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/master" --jq .sha)" = "$RELEASE_COMMIT"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --jq '.[].tag_name' > "$RUNNER_TEMP/releases.txt"
          if grep -Fxq "$tag" "$RUNNER_TEMP/releases.txt"; then
            echo "Release $tag already exists; leaving it unchanged."
          else
            git ls-remote --tags origin "refs/tags/$tag" > "$RUNNER_TEMP/release-tags.txt"
            if test -s "$RUNNER_TEMP/release-tags.txt"; then
              echo "Tag $tag already exists without a release. Inspect it before retrying."
              exit 1
            fi
            npm pack --ignore-scripts --json > "$RUNNER_TEMP/packed.json"
            archive="$(node -p 'require(process.env.RUNNER_TEMP + "/packed.json")[0].filename')"
            gh release create "$tag" "$archive" assets/homebridge-script2-icon.png assets/homebridge-script2-icon-512.png \
              --repo "$GITHUB_REPOSITORY" --target "$RELEASE_COMMIT" --title "Script2 $version" \
              --notes-file "releases/$tag.md" --latest
          fi

